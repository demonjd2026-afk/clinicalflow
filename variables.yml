variables:
  # Shared across all environments — override per target in databricks.yml

  pipeline_name:
    description: Lakeflow pipeline display name
    default: ClinicalFlow Batch Pipeline

  job_cluster_policy:
    description: Cluster policy ID for job clusters (set after policy is created in Databricks UI)
    default: ""

  spark_version:
    description: Databricks Runtime version
    default: "15.4.x-scala2.12"

  min_workers:
    description: Minimum autoscale workers
    default: "2"

  max_workers:
    description: Maximum autoscale workers
    default: "8"

  schedule_ingest:
    description: Cron schedule for ingest job (UTC)
    default: "0 6 * * *"   # 06:00 UTC daily

  schedule_genai:
    description: Cron schedule for GenAI enrichment job (UTC)
    default: "0 8 * * *"   # 08:00 UTC daily (after ingest)

  schedule_maintenance:
    description: Cron schedule for OPTIMIZE/VACUUM job (UTC)
    default: "0 2 * * 0"   # 02:00 UTC every Sunday
