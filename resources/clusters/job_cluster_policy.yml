# NOTE: Cluster policies are managed through the Databricks UI or REST API.
# This file documents the intended policy settings for reference.
# To create via CLI: databricks cluster-policies create --json @resources/clusters/policy.json
#
# Alternatively, create in Databricks UI:
# Compute → Cluster Policies → Create Policy → paste the JSON below

# Policy Name: ClinicalFlow Job Cluster Policy
#
# Enforces:
# - Spot instances with on-demand fallback (cost control)
# - Minimum DBR version (security / feature parity)
# - Azure-specific VM families only
# - Auto-termination on job completion

policy_definition:
  name: ClinicalFlow Job Cluster Policy
  description: Standard policy for all ClinicalFlow job clusters

